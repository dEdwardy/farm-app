<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渔场管家 - 水产养殖管理APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f9f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .app-container {
            width: 375px;
            height: 812px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .content-flex {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 24px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .content-flex::-webkit-scrollbar {
            display: none;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin: 40px 0 30px;
        }
        .app-name {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: #2e7d32;
            margin-bottom: 8px;
        }
        .slogan {
            font-size: 16px;
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #2e7d32;
            margin: 30px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8f5e9;
        }
        .feature-card {
            background: #f1f8e9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            margin-right: 10px;
        }
        .design-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .design-item {
            background: #f1f8e9;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="content-flex">
            <div class="logo-container">
                <svg width="120" height="120" viewBox="0 0 120 120">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4CAF50" />
                            <stop offset="100%" stop-color="#2196F3" />
                        </linearGradient>
                    </defs>
                    <path d="M60,20 C80,20 100,30 100,60 C100,90 80,100 60,100 C40,100 20,90 20,60 C20,30 40,20 60,20 Z" 
                          fill="url(#gradient)" />
                    <path d="M45,50 C55,40 75,40 85,50 C90,60 85,75 75,80 C65,85 50,80 45,70 C40,65 40,55 45,50 Z" 
                          fill="white" opacity="0.8" />
                    <path d="M50,55 C55,50 65,50 70,55 C75,65 70,75 60,80 C50,75 45,65 50,55 Z" 
                          fill="#E8F5E9" />
                    <path d="M60,65 L65,70 L55,70 Z" fill="#2E7D32" />
                </svg>
            </div>
            
            <h1 class="app-name">渔场管家</h1>
            <p class="slogan">智能水产养殖管理专家</p>
            
            <h2 class="section-title">核心功能</h2>
            <div class="feature-card">
                <span class="iconify" data-icon="mdi:fish" style="color: #4CAF50; font-size: 24px; margin-right: 10px;"></span>
                <div>
                    <h3 class="font-semibold text-gray-800">养殖监测</h3>
                    <p class="text-sm text-gray-600">实时监控水质参数与鱼类健康状况</p>
                </div>
            </div>
            <div class="feature-card">
                <span class="iconify" data-icon="mdi:calendar" style="color: #4CAF50; font-size: 24px; margin-right: 10px;"></span>
                <div>
                    <h3 class="font-semibold text-gray-800">喂养管理</h3>
                    <p class="text-sm text-gray-600">智能喂养计划与投喂记录</p>
                </div>
            </div>
            <div class="feature-card">
                <span class="iconify" data-icon="mdi:chart-line" style="color: #4CAF50; font-size: 24px; margin-right: 10px;"></span>
                <div>
                    <h3 class="font-semibold text-gray-800">生长分析</h3>
                    <p class="text-sm text-gray-600">鱼类生长趋势与产量预测</p>
                </div>
            </div>
            <div class="feature-card">
                <span class="iconify" data-icon="mdi:bell" style="color: #4CAF50; font-size: 24px; margin-right: 10px;"></span>
                <div>
                    <h3 class="font-semibold text-gray-800">智能预警</h3>
                    <p class="text-sm text-gray-600">异常情况即时通知</p>
                </div>
            </div>
            
            <h2 class="section-title">设计规范</h2>
            <div class="design-grid">
                <div class="design-item">
                    <h3 class="font-semibold text-gray-800 mb-2">主色</h3>
                    <div class="color-swatch mx-auto" style="background-color: #4CAF50;"></div>
                    <p class="text-sm mt-1">#4CAF50</p>
                </div>
                <div class="design-item">
                    <h3 class="font-semibold text-gray-800 mb-2">辅助色</h3>
                    <div class="color-swatch mx-auto" style="background-color: #2196F3;"></div>
                    <p class="text-sm mt-1">#2196F3</p>
                </div>
                <div class="design-item">
                    <h3 class="font-semibold text-gray-800 mb-2">字体</h3>
                    <p class="text-sm">Noto Sans SC</p>
                    <p class="text-xs text-gray-600">中英文通用</p>
                </div>
                <div class="design-item">
                    <h3 class="font-semibold text-gray-800 mb-2">图标</h3>
                    <span class="iconify mx-auto" data-icon="mdi:fish" style="color: #4CAF50; font-size: 24px;"></span>
                    <p class="text-xs text-gray-600">Material Design</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
