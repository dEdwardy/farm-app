<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渔场管家 - 引导页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #4CAF50 0%, #2196F3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            max-width: 414px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.6s ease-out;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            animation: bounceIn 1s ease-out;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .slogan {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .onboarding-steps {
            margin-bottom: 40px;
        }
        
        .step {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            text-align: left;
            animation: fadeInLeft 0.6s ease-out both;
        }
        
        .step:nth-child(1) {
            animation-delay: 0.6s;
        }
        
        .step:nth-child(2) {
            animation-delay: 0.8s;
        }
        
        .step:nth-child(3) {
            animation-delay: 1s;
        }
        
        .step-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .step-icon:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .step-description {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: white;
            color: #4CAF50;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .dots {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 8px;
            animation: fadeInUp 0.8s ease-out 1s both;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: white;
            width: 24px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounceIn {
            0%, 20%, 40%, 60%, 80%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-15px);
            }
            50% {
                transform: translateY(-10px);
            }
            70% {
                transform: translateY(-5px);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @media (max-width: 375px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .step-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4CAF50" />
                    <stop offset="100%" stop-color="#2196F3" />
                </linearGradient>
            </defs>
            <path d="M60,20 C80,20 100,30 100,60 C100,90 80,100 60,100 C40,100 20,90 20,60 C20,30 40,20 60,20 Z" 
                  fill="white" />
            <path d="M45,50 C55,40 75,40 85,50 C90,60 85,75 75,80 C65,85 50,80 45,70 C40,65 40,55 45,50 Z" 
                  fill="#E8F5E9" />
            <path d="M50,55 C55,50 65,50 70,55 C75,65 70,75 60,80 C50,75 45,65 50,55 Z" 
                  fill="#4CAF50" />
            <path d="M60,65 L65,70 L55,70 Z" fill="#2E7D32" />
        </svg>
        
        <!-- 标题 -->
        <h1>渔场管家</h1>
        <p class="slogan">智能水产养殖管理专家</p>
        
        <!-- 步骤指示器 -->
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <!-- 引导步骤 -->
        <div class="onboarding-steps">
            <div class="step">
                <div class="step-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 22V12H15V22" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="step-content">
                    <div class="step-title">养殖场管理</div>
                    <div class="step-description">轻松添加、编辑和管理您的养殖场信息</div>
                </div>
            </div>
            
            <div class="step">
                <div class="step-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 8V12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 16H12.01" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="step-content">
                    <div class="step-title">数据监测</div>
                    <div class="step-description">实时掌握养殖环境数据，科学管理</div>
                </div>
            </div>
            
            <div class="step">
                <div class="step-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 7H4C2.89543 7 2 7.89543 2 9V19C2 20.1046 2.89543 21 4 21H20C21.1046 21 22 20.1046 22 19V9C22 7.89543 21.1046 7 20 7Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 21V5C16 3.89543 15.1046 3 14 3H10C8.89543 3 8 3.89543 8 5V21" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="step-content">
                    <div class="step-title">安全管理</div>
                    <div class="step-description">规范管理安全信息，保障养殖安全</div>
                </div>
            </div>
        </div>
        
        <!-- 按钮 -->
        <div class="buttons">
            <button class="btn btn-primary">立即开始</button>
            <button class="btn btn-secondary">跳过引导</button>
        </div>
    </div>
    
    <script>
        // 简单的轮播逻辑
        const dots = document.querySelectorAll('.dot');
        let currentStep = 0;
        
        function nextStep() {
            dots[currentStep].classList.remove('active');
            currentStep = (currentStep + 1) % dots.length;
            dots[currentStep].classList.add('active');
        }
        
        // 自动轮播
        setInterval(nextStep, 3000);
        
        // 按钮交互效果
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            button.addEventListener('click', function() {
                // 模拟点击效果
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>
</body>
</html>
