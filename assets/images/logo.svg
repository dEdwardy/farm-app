<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="50%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 装饰圆环 -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#E0F2F1" stroke-width="4"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#B2DFDB" stroke-width="2" opacity="0.5"/>
  
  <!-- 主Logo - 水滴形状 -->
  <g transform="translate(512, 512) translate(-300, -300) scale(1.2)">
    <!-- 外轮廓 -->
    <path d="M300,100 C420,100 500,150 500,300 C500,450 420,500 300,500 C180,500 100,450 100,300 C100,150 180,100 300,100 Z" 
          fill="url(#iconGradient)"/>
    
    <!-- 内部鱼形 -->
    <path d="M225,250 C275,200 375,200 425,250 C450,300 425,375 375,400 C325,425 250,400 225,350 C200,325 200,275 225,250 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- 鱼眼 -->
    <ellipse cx="300" cy="275" rx="50" ry="37" fill="#E8F5E9"/>
    
    <!-- 鱼尾 -->
    <path d="M300,325 L325,350 L275,350 Z" fill="#2E7D32"/>
    
    <!-- 鱼鳞装饰 -->
    <path d="M260,280 Q280,268 300,280" stroke="#81C784" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M310,280 Q330,268 350,280" stroke="#81C784" stroke-width="4" fill="none" opacity="0.6"/>
  </g>
  
  <!-- 底部装饰波浪 -->
  <path d="M0,850 Q256,800 512,850 T1024,850 L1024,1024 L0,1024 Z" fill="#E8F5E9" opacity="0.3"/>
  <path d="M0,900 Q256,850 512,900 T1024,900 L1024,1024 L0,1024 Z" fill="#C8E6C9" opacity="0.3"/>
</svg>